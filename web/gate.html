<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TogetherCare AI</title>
    <style>
      :root {
        --bg: #f9f9f5;
        --text: #000000;
        --primary: #4e6f4e;
        --bubble-bg: #ffffff;
        --border: #e2e2da;
        --error: #a33a3a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: var(--bubble-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2rem;
      }
      h1 { margin: 0 0 0.4rem; font-size: 1.6rem; }
      p.sub { margin: 0 0 1.5rem; color: #5a5a52; font-size: 0.95rem; line-height: 1.45; }
      label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
      input {
        width: 100%;
        padding: 0.7rem 0.8rem;
        font-size: 1rem;
        font-family: inherit;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
      }
      input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
      button {
        width: 100%;
        margin-top: 1rem;
        padding: 0.7rem 1rem;
        font-size: 1rem;
        font-family: inherit;
        font-weight: 600;
        color: #ffffff;
        background: var(--primary);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .error {
        margin-top: 0.9rem;
        color: var(--error);
        font-size: 0.9rem;
        min-height: 1.2em;
      }
      .foot { margin-top: 1.5rem; font-size: 0.8rem; color: #7a7a72; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>TogetherCare AI</h1>
      <p class="sub">This is a research preview. Enter the access code you were given to continue.</p>

      <form id="gate">
        <label for="code">Access code</label>
        <input
          id="code"
          name="code"
          type="password"
          autocomplete="one-time-code"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          required
          autofocus
        />
        <button id="submit" type="submit">Enter</button>
        <div class="error" id="error" role="alert" aria-live="polite"></div>
      </form>

      <p class="foot">
        Conversations in this preview are logged for research. Please do not
        enter names, contact details, or other identifying information.
      </p>
    </main>

    <script>
      const form = document.getElementById("gate");
      const input = document.getElementById("code");
      const button = document.getElementById("submit");
      const error = document.getElementById("error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.textContent = "";
        button.disabled = true;
        button.textContent = "Checking...";
        try {
          const res = await fetch("/api/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: input.value }),
          });
          if (res.ok) {
            // Full reload rather than a client-side swap: the app bundle is
            // only served once the gate cookie exists.
            window.location.replace("/");
            return;
          }
          const data = await res.json().catch(() => ({}));
          error.textContent = data.error || "Could not verify that code.";
        } catch {
          error.textContent = "Network error. Check your connection and try again.";
        }
        input.value = "";
        input.focus();
        button.disabled = false;
        button.textContent = "Enter";
      });
    </script>
  </body>
</html>
